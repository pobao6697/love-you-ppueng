<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>풍선 터뜨리기 - Love You Ppueng</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
        background: #0f172a;
        overflow: hidden;
      }

      .park-scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 30%, #e0f2fe 65%, #fbcfe8 100%);
      }

      .sun-wrapper {
        position: absolute;
        top: 35px;
        right: 45px;
        width: 110px;
        height: 110px;
        pointer-events: none;
      }

      .sun {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, #fffbeb 0%, #fef08a 35%, #fde047 70%, #facc15 100%);
        box-shadow: 0 0 50px rgba(253, 224, 71, 0.8), 0 0 100px rgba(250, 204, 21, 0.4);
        animation: sunGlow 4s ease-in-out infinite alternate;
      }

      @keyframes sunGlow {
        0% { transform: scale(0.98); box-shadow: 0 0 40px rgba(253, 224, 71, 0.7); }
        100% { transform: scale(1.05); box-shadow: 0 0 65px rgba(253, 224, 71, 0.9); }
      }

      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 100px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }

      .cloud::before, .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }

      .cloud-one { top: 60px; left: 5%; width: 140px; height: 48px; animation: floatCloud 22s linear infinite; }
      .cloud-one::before { width: 60px; height: 60px; top: -25px; left: 20px; }
      .cloud-one::after { width: 70px; height: 70px; top: -30px; right: 20px; }

      .cloud-two { top: 120px; right: 8%; width: 180px; height: 56px; animation: floatCloud 28s linear infinite reverse; }
      .cloud-two::before { width: 75px; height: 75px; top: -32px; left: 25px; }
      .cloud-two::after { width: 85px; height: 85px; top: -38px; right: 25px; }

      @keyframes floatCloud {
        0% { transform: translateX(0); }
        50% { transform: translateX(35px); }
        100% { transform: translateX(0); }
      }

      .game-panel {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      .title-wrap {
        text-align: center;
        padding: 20px 0 10px;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        color: #0369a1;
        font-size: clamp(26px, 5vw, 42px);
        font-weight: 900;
        letter-spacing: -1px;
        text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8), 0 4px 12px rgba(3, 105, 161, 0.15);
      }

      .start-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }

      .start-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: 35px;
        padding: 26px 52px;
        font-size: clamp(24px, 4.5vw, 36px);
        font-weight: 900;
        color: #ffffff;
        background: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #e11d48 100%);
        box-shadow: 0 15px 35px rgba(225, 29, 72, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
      }

      .start-btn:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 20px 40px rgba(225, 29, 72, 0.5);
      }

      .hud {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 8px 16px;
        flex-shrink: 0;
      }

      .info-box {
        min-width: 140px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        color: #0f172a;
        font-size: 1rem;
        font-weight: 800;
      }

      .info-box strong {
        font-size: 1.6rem;
        color: #e11d48;
        min-width: 45px;
        text-align: right;
      }

      .game-area {
        position: relative;
        flex: 1;
        width: 100%;
        overflow: hidden;
      }

      .balloon {
        position: absolute;
        border: none;
        border-radius: 50% 50% 48% 48%;
        cursor: pointer;
        box-shadow: inset -8px -8px 15px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.1);
        animation: floatUp 4s ease-in-out infinite alternate;
        transition: transform 0.1s ease;
        touch-action: manipulation;
      }

      .balloon::before {
        content: "";
        position: absolute;
        top: 15%;
        left: 20%;
        width: 25%;
        height: 25%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.65);
        filter: blur(1px);
      }

      .balloon-knot {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 8px;
        background: inherit;
        clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
      }

      .balloon-string {
        position: absolute;
        top: 100%;
        left: 50%;
        width: 2px;
        height: 60px;
        background: rgba(100, 116, 139, 0.5);
        transform-origin: top center;
        animation: stringWave 2s ease-in-out infinite alternate;
      }

      .balloon.burst {
        animation: popScale 0.25s ease-out forwards !important;
        pointer-events: none;
      }

      @keyframes floatUp {
        0% { transform: translateY(0) rotate(-2deg); }
        100% { transform: translateY(-18px) rotate(3deg); }
      }

      @keyframes stringWave {
        0% { transform: rotate(-4deg); }
        100% { transform: rotate(5deg); }
      }

      @keyframes popScale {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }

      .combo-toast {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
        z-index: 30;
        font-size: 2.2rem;
        font-weight: 900;
        color: #f43f5e;
        text-shadow: 0 4px 12px rgba(244, 63, 94, 0.3), 2px 2px 0 #fff;
        pointer-events: none;
      }

      .combo-toast.show {
        animation: comboPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes comboPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        50% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
      }

      .floating-message {
        position: fixed;
        left: 50%;
        top: 28%;
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
        z-index: 25;
        padding: 12px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        border: 2px solid #f43f5e;
        box-shadow: 0 12px 30px rgba(244, 63, 94, 0.25);
        color: #e11d48;
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 900;
        pointer-events: none;
      }

      .floating-message.show {
        animation: msgFly 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes msgFly {
        0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
        30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        70% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
      }

      .final-message {
        position: fixed;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        width: min(88%, 460px);
        z-index: 40;
        text-align: center;
        padding: 36px 28px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.95);
        border: 4px solid #fda4af;
        box-shadow: 0 25px 60px rgba(225, 29, 72, 0.3);
        color: #e11d48;
        font-size: clamp(28px, 6vw, 42px);
        font-weight: 900;
        line-height: 1.3;
      }

      .final-message.hidden, .restart-btn.hidden, .hidden {
        display: none !important;
      }

      .restart-btn {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        border: none;
        border-radius: 50px;
        padding: 16px 40px;
        background: linear-gradient(135deg, #f43f5e, #e11d48);
        color: white;
        font-size: 1.25rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(225, 29, 72, 0.4);
        z-index: 40;
      }
    </style>
  </head>
  <body>
    <div class="park-scene">
      <div class="sun-wrapper"><div class="sun"></div></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>

      <div class="game-panel">
        <div class="title-wrap">
          <h1>풍선 터뜨리기</h1>
        </div>

        <div id="startScreen" class="start-screen">
          <button id="startBtn" class="start-btn" type="button">
            <span>쟈끼이~!!</span>
            <span>게임시작!!</span>
          </button>
        </div>

        <div id="hud" class="hud hidden">
          <div class="info-box">
            <span>시간</span>
            <strong id="timeLeft">10</strong>
          </div>
          <div class="info-box">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
        </div>

        <div id="gameArea" class="game-area hidden"></div>

        <div id="comboToast" class="combo-toast">COMBO x2!</div>
        <div id="floatingMessage" class="floating-message"></div>
        <div id="finalMessage" class="final-message hidden"></div>

        <button id="restartBtn" class="restart-btn hidden" type="button">다시 하기</button>
      </div>
    </div>

    <script>
      const phrases = ['세현아', '잘 도착 했옹?', '저녁 뭐 먹엉!', '짜끼이~~~!!', '사랑해~~~', '오늘도 고생 많아쬽!!'];
      const colors = ['#ff4d6d', '#ff758f', '#ffb3c1', '#38bdf8', '#4ade80', '#facc15', '#c084fc', '#fb923c'];

      const startBtn = document.getElementById('startBtn');
      const startScreen = document.getElementById('startScreen');
      const hud = document.getElementById('hud');
      const gameArea = document.getElementById('gameArea');
      const timeLeftEl = document.getElementById('timeLeft');
      const scoreEl = document.getElementById('score');
      const comboToastEl = document.getElementById('comboToast');
      const floatingMessageEl = document.getElementById('floatingMessage');
      const finalMessageEl = document.getElementById('finalMessage');
      const restartBtn = document.getElementById('restartBtn');

      let remainingTime = 10;
      let score = 0;
      let combo = 0;
      let lastPopTime = 0;
      let timerId = null;
      let gameFinished = false;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (AudioCtor) audioCtx = new AudioCtor();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playTone(freq, duration = 0.1) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      function showMsg() {
        const text = phrases[Math.floor(Math.random() * phrases.length)];
        floatingMessageEl.textContent = text;
        floatingMessageEl.classList.remove('show');
        void floatingMessageEl.offsetWidth;
        floatingMessageEl.classList.add('show');
      }

      function showComboToast(c) {
        comboToastEl.textContent = `COMBO x${c}!`;
        comboToastEl.classList.remove('show');
        void comboToastEl.offsetWidth;
        comboToastEl.classList.add('show');
      }

      function createBalloon() {
        if (gameFinished) return;
        const balloon = document.createElement('div');
        balloon.className = 'balloon';

        // 随机三种类型气球：小（30分）、中（22分）、大（15分）
        const types = [
          { size: 55, pts: 30 },
          { size: 70, pts: 22 },
          { size: 85, pts: 15 }
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];

        balloon.style.width = `${type.size}px`;
        balloon.style.height = `${type.size * 1.2}px`;
        balloon.style.background = color;

        // 保证生成在可视范围内
        const widthBound = Math.max(20, gameArea.clientWidth - type.size - 20);
        const heightBound = Math.max(20, gameArea.clientHeight - type.size * 1.2 - 20);
        balloon.style.left = `${Math.floor(Math.random() * widthBound)}px`;
        balloon.style.top = `${Math.floor(Math.random() * heightBound)}px`;

        const knot = document.createElement('div');
        knot.className = 'balloon-knot';
        const string = document.createElement('div');
        string.className = 'balloon-string';
        balloon.appendChild(knot);
        balloon.appendChild(string);

        const handlePop = (e) => {
          if (e) e.preventDefault();
          if (gameFinished || balloon.classList.contains('burst')) return;

          initAudio();
          const now = Date.now();

          // 判断 1.0 秒内连击
          if (now - lastPopTime <= 1000) {
            combo = Math.min(combo + 1, 5);
          } else {
            combo = 1; // 超过 1 秒断连，重置为 1
          }
          lastPopTime = now;

          // 根据连击计算加成
          const multiplier = 1 + (combo - 1) * 0.2; // 1.0, 1.2, 1.4, 1.6, 1.8
          score += Math.round(type.pts * multiplier);
          scoreEl.textContent = String(score);

          playTone(280 + combo * 60, 0.1);
          if (combo >= 2) showComboToast(combo);
          showMsg();

          balloon.classList.add('burst');
          setTimeout(() => {
            balloon.remove();
            if (!gameFinished) {
              createBalloon(); // 补全消失的气球
            }
          }, 200);
        };

        balloon.addEventListener('pointerdown', handlePop);

        gameArea.appendChild(balloon);
      }

      function startGame() {
        initAudio();
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameArea.classList.remove('hidden');

        gameArea.innerHTML = '';
        finalMessageEl.classList.add('hidden');
        restartBtn.classList.add('hidden');

        remainingTime = 10;
        score = 0;
        combo = 0;
        lastPopTime = 0;
        gameFinished = false;

        timeLeftEl.textContent = String(remainingTime);
        scoreEl.textContent = '0';

        // 保持屏幕上始终有 8 个气球
        for (let i = 0; i < 8; i++) {
          createBalloon();
        }

        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          remainingTime--;
          timeLeftEl.textContent = String(remainingTime);
          if (remainingTime <= 0) {
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        gameFinished = true;
        clearInterval(timerId);
        gameArea.innerHTML = '';

        // 结算提示：뿌엥 xx점~~
        finalMessageEl.textContent = `뿌엥 ${score}점~~`;
        finalMessageEl.classList.remove('hidden');
        restartBtn.classList.remove('hidden');
      }

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);
    </script>
  </body>
</html>
